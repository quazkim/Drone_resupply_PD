name: Setup CPLEX + docplex
description: >
  Python + docplex + a FULL CPLEX Studio (the pip "cplex" community edition is
  capped at 1000 variables / 1000 constraints; this MILP has ~12k variables and
  ~144k constraints at n=10). Either pass a private installer URL, or run on a
  self-hosted runner that already has CPLEX importable from Python.

inputs:
  installer-url:
    description: Private URL of the Linux CPLEX Studio silent installer (.bin). Leave empty if CPLEX is preinstalled.
    required: false
    default: ''
  python-version:
    description: Must be a Python version supported by the installed CPLEX (22.1.x supports up to 3.10).
    required: false
    default: '3.10'
  install-dir:
    required: false
    default: /opt/cplex

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install CPLEX Studio from private installer
      if: inputs.installer-url != ''
      shell: bash
      env:
        INSTALLER_URL: ${{ inputs.installer-url }}
        INSTALL_DIR: ${{ inputs.install-dir }}
        PYVER: ${{ inputs.python-version }}
      run: |
        set -euo pipefail
        curl -fsSL "$INSTALLER_URL" -o /tmp/cplex_installer.bin
        chmod +x /tmp/cplex_installer.bin
        cat > /tmp/cplex.properties <<EOF
        INSTALLER_UI=silent
        LICENSE_ACCEPTED=TRUE
        USER_INSTALL_DIR=$INSTALL_DIR
        EOF
        sudo /tmp/cplex_installer.bin -f /tmp/cplex.properties
        rm -f /tmp/cplex_installer.bin
        CPLEX_PY=$(ls -d "$INSTALL_DIR"/cplex/python/"$PYVER"/x86-64_linux 2>/dev/null | head -1)
        if [ -z "$CPLEX_PY" ]; then
          echo "::error::No CPLEX python bindings for Python $PYVER under $INSTALL_DIR/cplex/python"
          ls "$INSTALL_DIR"/cplex/python || true
          exit 1
        fi
        echo "PYTHONPATH=$CPLEX_PY${PYTHONPATH:+:$PYTHONPATH}" >> "$GITHUB_ENV"

    - name: Install docplex
      shell: bash
      run: python -m pip install --quiet docplex

    - name: Verify CPLEX is usable and not the community edition
      shell: bash
      run: |
        python - <<'PYEOF'
        import sys
        try:
            from docplex.mp.model import Model
            m = Model()
            x = m.continuous_var_list(5000, ub=1)
            m.add_constraint(m.sum(x) >= 1)
            m.minimize(m.sum(x))
            assert m.solve() is not None
            print("CPLEX OK: solved a 5000-variable model (full edition)")
        except Exception as exc:
            print(f"::error::CPLEX unusable or size-limited (community edition?): {exc}")
            sys.exit(1)
        PYEOF
